<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Calculator - Calculadora web desenvolvida por Lucas Di Jorge Gonçalves de Freitas."
    >

    <title>Calculator | Lucas Di Jorge</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="calculator">

        <header class="calculator-header">

            <div>
                <span class="brand">CALCULATOR</span>

                <p>
                    JavaScript Project
                </p>
            </div>

            <div class="status">
                <span class="status-dot"></span>
                Online
            </div>

        </header>

        <section class="display">

            <div
                id="expression"
                class="expression"
                aria-label="Expressão atual"
            ></div>

            <div
                id="display"
                class="display-value"
                aria-label="Resultado"
            >
                0
            </div>

        </section>

        <section
            class="keypad"
            aria-label="Teclado da calculadora"
        >

            <button
                type="button"
                class="key function"
                data-action="clear"
            >
                AC
            </button>

            <button
                type="button"
                class="key function"
                data-action="delete"
            >
                ⌫
            </button>

            <button
                type="button"
                class="key function"
                data-action="percentage"
            >
                %
            </button>

            <button
                type="button"
                class="key operator"
                data-value="/"
            >
                ÷
            </button>

            <button
                type="button"
                class="key"
                data-value="7"
            >
                7
            </button>

            <button
                type="button"
                class="key"
                data-value="8"
            >
                8
            </button>

            <button
                type="button"
                class="key"
                data-value="9"
            >
                9
            </button>

            <button
                type="button"
                class="key operator"
                data-value="*"
            >
                ×
            </button>

            <button
                type="button"
                class="key"
                data-value="4"
            >
                4
            </button>

            <button
                type="button"
                class="key"
                data-value="5"
            >
                5
            </button>

            <button
                type="button"
                class="key"
                data-value="6"
            >
                6
            </button>

            <button
                type="button"
                class="key operator"
                data-value="-"
            >
                −
            </button>

            <button
                type="button"
                class="key"
                data-value="1"
            >
                1
            </button>

            <button
                type="button"
                class="key"
                data-value="2"
            >
                2
            </button>

            <button
                type="button"
                class="key"
                data-value="3"
            >
                3
            </button>

            <button
                type="button"
                class="key operator"
                data-value="+"
            >
                +
            </button>

            <button
                type="button"
                class="key zero"
                data-value="0"
            >
                0
            </button>

            <button
                type="button"
                class="key"
                data-value="."
            >
                .
            </button>

            <button
                type="button"
                class="key equals"
                data-action="calculate"
            >
                =
            </button>

        </section>

        <footer class="calculator-footer">

            <span>
                HTML
            </span>

            <span>•</span>

            <span>
                CSS
            </span>

            <span>•</span>

            <span>
                JavaScript
            </span>

        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
